# 发布新版本：推送版本标签（比如 v1.0.1）后，GitHub 自动测试、打包、发布到 Releases 页。
# 签名在作者电脑上做好（release.json 一起提交），这里从不接触私钥：只核对签名，没签好就不发布。
name: Release

on:
  push:
    # 平时每次上传也跑一遍测试和打包（只是不发布），问题早发现
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows：测试 + 打包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下载 Electron
        run: node node_modules/electron/install.js
      - name: 标签、package.json、release.json 的版本号必须一致
        shell: bash
        run: |
          node -e "
            const tag = process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME.replace(/^v/, '') : null;
            const pkg = require('./package.json').version, rel = require('./release.json').version;
            if (pkg !== rel || (tag && tag !== pkg)) { console.error('版本号对不上：', { tag, pkg, rel }); process.exit(1); }
            console.log('版本', pkg);"
      - name: 全部测试（必须是作者签好的正式版，桌面版测试不许跳过）
        run: node --test --test-timeout=180000 "tests/*.test.js"
        env:
          HOLA_RELEASE_CHECK: '1'
          HOLA_REQUIRE_APP: '1'
      - name: 打包 Windows 安装包
        run: npx electron-builder --win --publish never
      - name: 打包程序更新包
        run: node tools/pack-app.js
      - name: 测打出来的东西：安装版能用、更新包能通过签名核对并运行
        run: node --test --test-timeout=180000 tests/app.test.js tests/update.test.js
        env:
          HOLA_APP_EXE: ${{ github.workspace }}\dist\win-unpacked\Hola.exe
          HOLA_BUNDLE_DIR: ${{ github.workspace }}\dist
          HOLA_REQUIRE_APP: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Hola-Setup-*.exe
            dist/hola-app-*.zip
          if-no-files-found: error

  mac:
    name: Mac：测试 + 打包
    runs-on: macos-latest
    timeout-minutes: 45
    # Mac 版还是测试版：这一步出问题时 Windows 版照样发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 下载 Electron
        run: node node_modules/electron/install.js
      - name: 全部测试（在真的 Mac 上跑）
        run: node --test --test-timeout=180000 "tests/*.test.js"
        env:
          HOLA_RELEASE_CHECK: '1'
          HOLA_REQUIRE_APP: '1'
      - name: 打包 Mac 安装包（Apple 芯片、Intel 各一个，免费临时签名）
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Hola-*-mac-*.dmg
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: [windows, mac]
    if: ${{ !cancelled() && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 校验码
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Hola $GITHUB_REF_NAME" --generate-notes --latest
