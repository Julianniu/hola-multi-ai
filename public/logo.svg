<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hola 标志（V3）：白底，三个圆 + 中间一点，只用黑色线条 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E8EB"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="58"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect x="1" y="1" width="254" height="254" rx="57" fill="none" stroke="#000000" stroke-opacity=".10" stroke-width="2"/>
    <!-- mark -->
    <g fill="none" stroke="#16181C" stroke-width="11">
      <circle cx="128" cy="104" r="52"/>
      <circle cx="103" cy="147" r="52"/>
      <circle cx="153" cy="147" r="52"/>
    </g>
    <circle cx="128" cy="131" r="12" fill="#16181C"/>
  </g>
</svg>
